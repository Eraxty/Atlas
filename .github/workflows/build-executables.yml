name: build-executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: ""
            artifact: atlas-linux
          - os: windows-latest
            suffix: ".exe"
            artifact: atlas-windows
          - os: macos-latest
            suffix: ""
            artifact: atlas-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build atlas
        run: >
          pyinstaller --onefile --console --clean --name atlas
          --collect-submodules keyring
          --hidden-import bg_indexer
          main.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/atlas${{ matrix.suffix }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases

      - name: Stage binaries
        shell: bash
        run: |
          ls -R releases
          mkdir -p final
          cp $(find releases/atlas-linux -type f -name 'atlas*' | head -1) final/atlas-linux
          cp $(find releases/atlas-windows -type f -name 'atlas*' | head -1) final/atlas-windows.exe
          cp $(find releases/atlas-macos -type f -name 'atlas*' | head -1) final/atlas-macos
          ls -l final

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          allowUpdates: true
          files: final/*